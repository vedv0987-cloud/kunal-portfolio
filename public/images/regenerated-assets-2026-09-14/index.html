<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regenerated images</title><style>body{margin:30px;background:#fafafa;color:#151515;font:16px Arial}h1{font-size:36px}p{color:#555}input,select{padding:12px;margin:5px;border:1px solid #ccc;border-radius:6px;font:inherit}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:25px}article{background:white;border:1px solid #ddd;border-radius:8px;padding:12px;overflow-wrap:anywhere}img{width:100%;height:210px;object-fit:contain;background:#eee}a{color:#c00020}small{display:block;margin:10px 0}header{position:sticky;top:0;background:#fafafaf5;padding:12px 0}button{cursor:pointer;padding:10px} @media(max-width:500px){body{margin:16px}h1{font-size:28px}}</style><h1>Regenerated artwork</h1><p>Each PNG has its own folder, grouped by page. Client-logo files and trusted-brand strips are excluded. This gallery refreshes as completed images are saved.</p><header><strong id="status">Loading progress…</strong><br><input id="search" placeholder="Search filenames" aria-label="Search"><select id="page" aria-label="Page"><option value="">All pages</option><option>home</option><option>work</option><option>services</option><option>about</option><option>case-study</option><option>contact</option><option>shared</option></select></header><div id="grid"></div><script>let assets=[];function render(){const q=document.querySelector('#search').value.toLowerCase(),p=document.querySelector('#page').value;const rows=assets.filter(a=>a.status==='generated'&&(!q||a.id.includes(q))&&(!p||a.id.startsWith(p+'/')));const grid=document.querySelector('#grid');grid.replaceChildren();for(const a of rows){const c=document.createElement('article'),link=document.createElement('a'),img=document.createElement('img'),name=document.createElement('strong'),meta=document.createElement('small'),dl=document.createElement('a');img.src=a.file;img.loading='lazy';img.alt=a.id;link.href=a.file;link.target='_blank';link.append(img);name.textContent=a.id;meta.textContent=(a.actualSize||[]).join(' × ')+' px · PNG';dl.textContent='Download PNG';dl.href=a.file;dl.download='';c.append(link,name,meta,dl);grid.append(c)}}async function refresh(){const r=await fetch('generation-manifest.json?t='+Date.now());const m=await r.json();const changed=JSON.stringify(assets)!==JSON.stringify(m.assets);assets=m.assets;document.querySelector('#status').textContent=assets.filter(a=>a.status==='generated').length+' / '+assets.length+' images saved';if(changed)render()}document.querySelector('#search').oninput=render;document.querySelector('#page').onchange=render;refresh();setInterval(refresh,15000);</script></html>
